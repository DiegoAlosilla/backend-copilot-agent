name: Harness checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify gates and evaluation scorer with synthetic fixtures
        shell: pwsh
        run: ./tests/Test-Harness.ps1
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows PowerShell 5.1 compatibility
        shell: powershell
        run: ./tests/Test-Harness.ps1
